<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" aria-label="Royal Results Crown">
  <defs>

    <!-- Gold linear — top highlight to deep gold -->
    <linearGradient id="gldMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFF5B0"/>
      <stop offset="30%" stop-color="#E8C040"/>
      <stop offset="65%" stop-color="#C08010"/>
      <stop offset="100%" stop-color="#7A4E00"/>
    </linearGradient>

    <!-- Gold radial for arches —  bright center, dark edges -->
    <radialGradient id="gldArch" cx="50%" cy="0%" r="100%">
      <stop offset="0%"  stop-color="#FFF8C0"/>
      <stop offset="45%" stop-color="#D4A010"/>
      <stop offset="100%" stop-color="#7A4E00"/>
    </radialGradient>

    <!-- Velvet cap fill -->
    <radialGradient id="velvet" cx="50%" cy="20%" r="75%">
      <stop offset="0%"  stop-color="#3A55CC"/>
      <stop offset="100%" stop-color="#080F3A"/>
    </radialGradient>

    <!-- Band fill -->
    <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFF0A0"/>
      <stop offset="40%" stop-color="#C89010"/>
      <stop offset="100%" stop-color="#6A3E00"/>
    </linearGradient>

    <!-- Orb gradient -->
    <radialGradient id="orbGrad" cx="35%" cy="25%" r="70%">
      <stop offset="0%"  stop-color="#FFFACC"/>
      <stop offset="50%" stop-color="#D4A010"/>
      <stop offset="100%" stop-color="#7A4E00"/>
    </radialGradient>

    <!-- Luminous glow -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip for velvet inside arches -->
    <clipPath id="archClip">
      <path d="M18 105 L18 72
               C18 42 42 10 100 8
               C158 10 182 42 182 72
               L182 105 Z"/>
    </clipPath>

  </defs>

  <!-- ══════════════════════════════════════════════
       VELVET CAP (clipped inside arch silhouette)
  ══════════════════════════════════════════════ -->
  <path d="M18 105 L18 72
           C18 42 42 10 100 8
           C158 10 182 42 182 72
           L182 105 Z"
        fill="url(#velvet)"/>

  <!-- ══════════════════════════════════════════════
       CROSSING ARCH BANDS
       Two arches cross from left-base to right-top
       and right-base to left-top, meeting at center orb.
       Each arch is ~14px wide gold band.
  ══════════════════════════════════════════════ -->

  <!-- LEFT arch: rises from lower-left band, arcs over to upper-right -->
  <!-- Outer edge -->
  <path d="M26 105
           C26 85 38 52 100 22
           C162 52 174 85 174 105"
        stroke="url(#gldArch)" stroke-width="13" fill="none"
        stroke-linecap="round" filter="url(#glowSm)"/>

  <!-- RIGHT arch (perpendicular): rises from lower-right band, arcs to upper-left -->
  <!-- We rotate 90° around center (100,65) -->
  <!-- In a true closed crown the two arches are at ~90° to each other -->
  <!-- Arch 2 goes: from right side base inward over top -->
  <path d="M60 105
           C60 75 72 38 100 22
           C128 38 140 75 140 105"
        stroke="url(#gldArch)" stroke-width="13" fill="none"
        stroke-linecap="round" filter="url(#glowSm)"/>

  <!-- Arch highlight lines (inner bright line on each arch) -->
  <path d="M26 105 C26 85 38 52 100 22 C162 52 174 85 174 105"
        stroke="#FFF8C0" stroke-width="2" fill="none" opacity="0.55"/>
  <path d="M60 105 C60 75 72 38 100 22 C128 38 140 75 140 105"
        stroke="#FFF8C0" stroke-width="2" fill="none" opacity="0.55"/>

  <!-- Arch shadow lines (outer dark edge on each arch) -->
  <path d="M26 105 C26 85 38 52 100 22 C162 52 174 85 174 105"
        stroke="#7A4E00" stroke-width="14" fill="none" opacity="0.3"
        stroke-linecap="round"/>
  <path d="M60 105 C60 75 72 38 100 22 C128 38 140 75 140 105"
        stroke="#7A4E00" stroke-width="14" fill="none" opacity="0.3"
        stroke-linecap="round"/>

  <!-- ══════════════════════════════════════════════
       SMALL FLEUR / ORB TIPS ON ARCH BASES
       Where each arch meets the crown band — 4 points
  ══════════════════════════════════════════════ -->

  <!-- Left arch left-base tip -->
  <g filter="url(#glow)">
    <circle cx="26" cy="105" r="5.5" fill="url(#orbGrad)" stroke="#C08010" stroke-width="1"/>
    <circle cx="26" cy="105" r="2" fill="#FFF8C0"/>
  </g>
  <!-- Left arch right-base tip -->
  <g filter="url(#glow)">
    <circle cx="174" cy="105" r="5.5" fill="url(#orbGrad)" stroke="#C08010" stroke-width="1"/>
    <circle cx="174" cy="105" r="2" fill="#FFF8C0"/>
  </g>
  <!-- Right arch left-base tip -->
  <g filter="url(#glow)">
    <circle cx="60" cy="105" r="5.5" fill="url(#orbGrad)" stroke="#C08010" stroke-width="1"/>
    <circle cx="60" cy="105" r="2" fill="#FFF8C0"/>
  </g>
  <!-- Right arch right-base tip -->
  <g filter="url(#glow)">
    <circle cx="140" cy="105" r="5.5" fill="url(#orbGrad)" stroke="#C08010" stroke-width="1"/>
    <circle cx="140" cy="105" r="2" fill="#FFF8C0"/>
  </g>

  <!-- ══════════════════════════════════════════════
       CENTER TOP ORB + CROSS
  ══════════════════════════════════════════════ -->

  <!-- Orb glow halo -->
  <circle cx="100" cy="22" r="14" fill="#FFE566" opacity="0.12" filter="url(#glowLg)"/>

  <!-- Orb body -->
  <circle cx="100" cy="22" r="10" fill="url(#orbGrad)" stroke="#C08010" stroke-width="1.5"
          filter="url(#glow)"/>
  <!-- Orb equator line -->
  <path d="M90.5 22 Q100 18 109.5 22" stroke="#FFF0A0" stroke-width="1" fill="none" opacity="0.6"/>
  <!-- Orb highlight -->
  <ellipse cx="96" cy="17" rx="4" ry="2.5" fill="#FFFACC" opacity="0.55"/>

  <!-- Cross stem -->
  <rect x="98.5" y="8" width="3" height="11" rx="1" fill="url(#gldMain)" filter="url(#glowSm)"/>
  <!-- Cross bar -->
  <rect x="93.5" y="11" width="13" height="3" rx="1" fill="url(#gldMain)" filter="url(#glowSm)"/>
  <!-- Cross highlight -->
  <rect x="99.2" y="8.5" width="1.2" height="10" rx="0.6" fill="#FFF8C0" opacity="0.6"/>
  <!-- Cross cap orb -->
  <circle cx="100" cy="8" r="2.2" fill="url(#orbGrad)" stroke="#C08010" stroke-width="0.8"
          filter="url(#glowSm)"/>

  <!-- ══════════════════════════════════════════════
       BASE BAND
  ══════════════════════════════════════════════ -->

  <!-- Band shadow for depth -->
  <rect x="10" y="103" width="180" height="28" rx="5" fill="#5A3500" opacity="0.35"/>

  <!-- Band body -->
  <rect x="10" y="101" width="180" height="28" rx="5" fill="url(#bandGrad)"
        filter="url(#glowSm)"/>

  <!-- Band top highlight -->
  <rect x="10" y="101" width="180" height="4" rx="3" fill="#FFF8C0" opacity="0.55"/>

  <!-- Scallop arch detail row on band -->
  <!-- 9 small arched niches along the band -->
  <path d="
    M14 101 Q22 94 30 101
    M30 101 Q38 94 46 101
    M46 101 Q54 94 62 101
    M62 101 Q70 94 78 101
    M78 101 Q86 94 94 101
    M94 101 Q102 94 110 101
    M110 101 Q118 94 126 101
    M126 101 Q134 94 142 101
    M142 101 Q150 94 158 101
    M158 101 Q166 94 174 101
    M174 101 Q181 94 186 101"
    stroke="#C08010" stroke-width="1.2" fill="none" opacity="0.7"/>

  <!-- Band lower rope braid -->
  <path d="M14 120 Q26 116 38 120 Q50 124 62 120 Q74 116 86 120 Q98 124 110 120 Q122 116 134 120 Q146 124 158 120 Q170 116 182 120 Q188 122 186 123"
        stroke="#FFF0A0" stroke-width="1" fill="none" opacity="0.35"/>

  <!-- ══════════════════════════════════════════════
       PEARLS ON BAND TOP RIM — 11 pearls
  ══════════════════════════════════════════════ -->
  <g filter="url(#glowSm)">
    <circle cx="22"  cy="101" r="3.2" fill="#F8F0DC" stroke="#C08010" stroke-width="0.8"/>
    <circle cx="38"  cy="101" r="3.2" fill="#F8F0DC" stroke="#C08010" stroke-width="0.8"/>
    <circle cx="54"  cy="101" r="3.2" fill="#F8F0DC" stroke="#C08010" stroke-width="0.8"/>
    <circle cx="70"  cy="101" r="3.2" fill="#F8F0DC" stroke="#C08010" stroke-width="0.8"/>
    <circle cx="86"  cy="101" r="3.2" fill="#F8F0DC" stroke="#C08010" stroke-width="0.8"/>
    <circle cx="100" cy="101" r="3.5" fill="#F8F0DC" stroke="#C08010" stroke-width="0.9"/>
    <circle cx="114" cy="101" r="3.2" fill="#F8F0DC" stroke="#C08010" stroke-width="0.8"/>
    <circle cx="130" cy="101" r="3.2" fill="#F8F0DC" stroke="#C08010" stroke-width="0.8"/>
    <circle cx="146" cy="101" r="3.2" fill="#F8F0DC" stroke="#C08010" stroke-width="0.8"/>
    <circle cx="162" cy="101" r="3.2" fill="#F8F0DC" stroke="#C08010" stroke-width="0.8"/>
    <circle cx="178" cy="101" r="3.2" fill="#F8F0DC" stroke="#C08010" stroke-width="0.8"/>
    <!-- pearl shine spots -->
    <circle cx="21"  cy="99.5" r="1" fill="white" opacity="0.7"/>
    <circle cx="37"  cy="99.5" r="1" fill="white" opacity="0.7"/>
    <circle cx="53"  cy="99.5" r="1" fill="white" opacity="0.7"/>
    <circle cx="69"  cy="99.5" r="1" fill="white" opacity="0.7"/>
    <circle cx="85"  cy="99.5" r="1" fill="white" opacity="0.7"/>
    <circle cx="99"  cy="99.5" r="1.1" fill="white" opacity="0.7"/>
    <circle cx="113" cy="99.5" r="1" fill="white" opacity="0.7"/>
    <circle cx="129" cy="99.5" r="1" fill="white" opacity="0.7"/>
    <circle cx="145" cy="99.5" r="1" fill="white" opacity="0.7"/>
    <circle cx="161" cy="99.5" r="1" fill="white" opacity="0.7"/>
    <circle cx="177" cy="99.5" r="1" fill="white" opacity="0.7"/>
  </g>

  <!-- ══════════════════════════════════════════════
       FLEUR-DE-LIS DETAILS ON ARCH BASES
       Small decorative fleurs where arches meet band
  ══════════════════════════════════════════════ -->

  <!-- Fleur at left outer (x=26) -->
  <g fill="#D4A010" filter="url(#glowSm)">
    <path d="M26 102 Q23.5 97 24 93 Q26 95.5 26.5 98.5 Q27.5 95.5 28.5 93 Q29 97 26.5 102Z"/>
  </g>
  <!-- Fleur at left inner (x=60) -->
  <g fill="#D4A010" filter="url(#glowSm)">
    <path d="M60 102 Q57.5 97 58 93 Q60 95.5 60.5 98.5 Q61.5 95.5 62.5 93 Q63 97 60.5 102Z"/>
  </g>
  <!-- Fleur at center (x=100) -->
  <g fill="#D4A010" filter="url(#glow)">
    <path d="M100 102 Q97 95.5 97.5 90 Q100 93.5 100.5 97 Q101.5 93.5 103 90 Q103.5 95.5 100.5 102Z"/>
    <circle cx="100" cy="89" r="2.5" fill="#FFF0A0" stroke="#C08010" stroke-width="0.7"/>
  </g>
  <!-- Fleur at right inner (x=140) -->
  <g fill="#D4A010" filter="url(#glowSm)">
    <path d="M140 102 Q137.5 97 138 93 Q140 95.5 140.5 98.5 Q141.5 95.5 142.5 93 Q143 97 140.5 102Z"/>
  </g>
  <!-- Fleur at right outer (x=174) -->
  <g fill="#D4A010" filter="url(#glowSm)">
    <path d="M174 102 Q171.5 97 172 93 Q174 95.5 174.5 98.5 Q175.5 95.5 176.5 93 Q177 97 174.5 102Z"/>
  </g>

  <!-- ══════════════════════════════════════════════
       OUTER CROWN SILHOUETTE BORDER (gold rim)
  ══════════════════════════════════════════════ -->
  <path d="M18 105 L18 72
           C18 42 42 10 100 8
           C158 10 182 42 182 72
           L182 105"
        stroke="#D4A010" stroke-width="2" fill="none"
        filter="url(#glowSm)"/>

</svg>
