<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none" aria-label="Royal Results Crown">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="55%" stop-color="D4A017"/>
      <stop offset="100%" stop-color="#8B6200"/>
    </radialGradient>
    <radialGradient id="goldGlowB" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="55%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#8B6200"/>
    </radialGradient>
    <radialGradient id="velvet" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2A4A9B"/>
      <stop offset="100%" stop-color="#0D1E5C"/>
    </radialGradient>
    <linearGradient id="goldBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE580"/>
      <stop offset="40%" stop-color="#C8940A"/>
      <stop offset="100%" stop-color="#7A4E00"/>
    </linearGradient>
    <filter id="lumGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sapphireGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base band -->
  <rect x="8" y="67" width="104" height="17" rx="3" fill="url(#goldBand)" filter="url(#softGlow)"/>
  <rect x="8" y="67" width="104" height="2.5" rx="1" fill="#FFE97F" opacity="0.65"/>
  <!-- Rope braid detail on band -->
  <path d="M12 73 Q20 70 28 73 Q36 76 44 73 Q52 70 60 73 Q68 76 76 73 Q84 70 92 73 Q100 76 108 73" stroke="#D4A017" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Crown body velvet dome -->
  <path d="M15 69 L15 47 Q19 31 31 27 L41 51 L51 21 L60 13 L69 21 L79 51 L89 27 Q101 31 105 47 L105 69 Z" fill="url(#velvet)"/>
  <!-- Gold crown outline with glow -->
  <path d="M15 69 L15 47 Q19 31 31 27 L41 51 L51 21 L60 13 L69 21 L79 51 L89 27 Q101 31 105 47 L105 69 Z" stroke="#D4A017" stroke-width="2.2" fill="none" filter="url(#lumGlow)"/>

  <!-- Internal gold ribs on velvet -->
  <line x1="60" y1="13" x2="60" y2="69" stroke="#C8940A" stroke-width="1" opacity="0.4"/>
  <line x1="41" y1="51" x2="37" y2="69" stroke="#C8940A" stroke-width="0.8" opacity="0.35"/>
  <line x1="79" y1="51" x2="83" y2="69" stroke="#C8940A" stroke-width="0.8" opacity="0.35"/>
  <line x1="31" y1="27" x2="22" y2="69" stroke="#C8940A" stroke-width="0.7" opacity="0.25"/>
  <line x1="89" y1="27" x2="98" y2="69" stroke="#C8940A" stroke-width="0.7" opacity="0.25"/>

  <!-- === SIX POINTS (fleur-de-lis spikes) === -->

  <!-- Point 1: Far-left outer spike -->
  <g filter="url(#lumGlow)">
    <path d="M15 47 Q10 40 8 33 Q13 31 17 36 Q15 42 15 47Z" fill="url(#goldGlowB)" stroke="#C8940A" stroke-width="0.8"/>
    <circle cx="11" cy="30" r="2.5" fill="#FFE566" stroke="#C8940A" stroke-width="0.6"/>
    <line x1="11" y1="27.5" x2="11" y2="22" stroke="#C8940A" stroke-width="1.5"/>
    <path d="M11 22 Q8.5 17 7.5 15 Q11 15.5 12 18.5 Q13 15.5 14.5 15 Q13.5 17 11 22Z" fill="#D4A017"/>
    <path d="M11 22 Q8 21 7 19 Q9.5 19.5 11 22Z" fill="#C8940A"/>
    <path d="M11 22 Q14 21 15 19 Q12.5 19.5 11 22Z" fill="#C8940A"/>
  </g>

  <!-- Point 2: Left-mid spike (valley of left arch) -->
  <g filter="url(#softGlow)">
    <path d="M31 27 Q29 21 29 16 Q32 15 34 18 Q33 23 31 27Z" fill="url(#goldGlowB)" stroke="#C8940A" stroke-width="0.8"/>
    <circle cx="31" cy="13" r="2.2" fill="#FFE566" stroke="#C8940A" stroke-width="0.5"/>
    <line x1="31" y1="10.8" x2="31" y2="6" stroke="#C8940A" stroke-width="1.3"/>
    <path d="M31 6 Q28.5 1.5 28 0 Q31 0.5 32 3 Q33 0.5 34 0 Q33.5 1.5 31 6Z" fill="#D4A017"/>
  </g>

  <!-- Point 3: Center top (tallest) -->
  <g filter="url(#lumGlow)">
    <circle cx="60" cy="11" r="3.2" fill="#D4A017" stroke="#FFE566" stroke-width="0.8"/>
    <line x1="60" y1="7.8" x2="60" y2="1" stroke="#C8940A" stroke-width="2"/>
    <path d="M60 1 Q56.5 -4 55.5 -6 Q60 -5 61 -1.5 Q62 -5 64.5 -6 Q63.5 -4 60 1Z" fill="#D4A017" transform="translate(0 6)"/>
    <path d="M60 1 Q55.5 0 54 -2 Q57 -1 60 1Z" fill="#C8940A" transform="translate(0 6)"/>
    <path d="M60 1 Q64.5 0 66 -2 Q63 -1 60 1Z" fill="#C8940A" transform="translate(0 6)"/>
    <!-- glow halo around center point -->
    <circle cx="60" cy="7" r="6" fill="#FFE566" opacity="0.08"/>
  </g>

  <!-- Point 4: Right-mid spike -->
  <g filter="url(#softGlow)">
    <path d="M89 27 Q91 21 91 16 Q88 15 86 18 Q87 23 89 27Z" fill="url(#goldGlowB)" stroke="#C8940A" stroke-width="0.8"/>
    <circle cx="89" cy="13" r="2.2" fill="#FFE566" stroke="#C8940A" stroke-width="0.5"/>
    <line x1="89" y1="10.8" x2="89" y2="6" stroke="#C8940A" stroke-width="1.3"/>
    <path d="M89 6 Q86.5 1.5 86 0 Q89 0.5 90 3 Q91 0.5 92 0 Q91.5 1.5 89 6Z" fill="#D4A017"/>
  </g>

  <!-- Point 5: Far-right outer spike -->
  <g filter="url(#lumGlow)">
    <path d="M105 47 Q110 40 112 33 Q107 31 103 36 Q105 42 105 47Z" fill="url(#goldGlowB)" stroke="#C8940A" stroke-width="0.8"/>
    <circle cx="109" cy="30" r="2.5" fill="#FFE566" stroke="#C8940A" stroke-width="0.6"/>
    <line x1="109" y1="27.5" x2="109" y2="22" stroke="#C8940A" stroke-width="1.5"/>
    <path d="M109 22 Q106.5 17 105.5 15 Q109 15.5 110 18.5 Q111 15.5 112.5 15 Q111.5 17 109 22Z" fill="#D4A017"/>
    <path d="M109 22 Q106 21 105 19 Q107.5 19.5 109 22Z" fill="#C8940A"/>
    <path d="M109 22 Q112 21 113 19 Q110.5 19.5 109 22Z" fill="#C8940A"/>
  </g>

  <!-- Point 6: Interior center fleur-de-lis on dome base -->
  <g filter="url(#softGlow)">
    <!-- Five base fleurs along the dome edge -->
    <path d="M24 69 Q22 64 23 59 Q25 62 25.5 65 Q27 62 28 59 Q28 64 26 69Z" fill="#D4A017"/>
    <path d="M40 69 Q38 63 39 57.5 Q41 61 41.5 64 Q43 61 44 57.5 Q44 63 42 69Z" fill="#D4A017"/>
    <path d="M57.5 69 Q55.5 62 56.5 56 Q58.5 60.5 59 63.5 Q60.5 60.5 61.5 56 Q62.5 62 60.5 69Z" fill="#D4A017"/>
    <path d="M78 69 Q76 63 77 57.5 Q79 61 79.5 64 Q81 61 82 57.5 Q82 63 80 69Z" fill="#D4A017"/>
    <path d="M94 69 Q92 64 93 59 Q95 62 95.5 65 Q97 62 98 59 Q98 64 96 69Z" fill="#D4A017"/>
  </g>

  <!-- Sapphire gems on band -->
  <g filter="url(#sapphireGlow)">
    <!-- Center large sapphire -->
    <ellipse cx="60" cy="75.5" rx="5.5" ry="4.2" fill="#1E4FCC"/>
    <ellipse cx="60" cy="75.5" rx="5.5" ry="4.2" stroke="#7AAFFF" stroke-width="0.9" fill="none"/>
    <ellipse cx="58" cy="73.8" rx="1.8" ry="1.2" fill="#C8E0FF" opacity="0.65"/>
    <!-- Left sapphire -->
    <ellipse cx="34" cy="75.5" rx="3.8" ry="3" fill="#1840B8"/>
    <ellipse cx="34" cy="75.5" rx="3.8" ry="3" stroke="#5A90EE" stroke-width="0.7" fill="none"/>
    <ellipse cx="32.8" cy="74.2" rx="1.1" ry="0.8" fill="#C8E0FF" opacity="0.55"/>
    <!-- Right sapphire -->
    <ellipse cx="86" cy="75.5" rx="3.8" ry="3" fill="#1840B8"/>
    <ellipse cx="86" cy="75.5" rx="3.8" ry="3" stroke="#5A90EE" stroke-width="0.7" fill="none"/>
    <ellipse cx="84.8" cy="74.2" rx="1.1" ry="0.8" fill="#C8E0FF" opacity="0.55"/>
  </g>

  <!-- Pearl accents on band rim -->
  <circle cx="20" cy="67.5" r="2" fill="#F0EAD6" stroke="#C8940A" stroke-width="0.5" filter="url(#softGlow)"/>
  <circle cx="100" cy="67.5" r="2" fill="#F0EAD6" stroke="#C8940A" stroke-width="0.5" filter="url(#softGlow)"/>
  <circle cx="47" cy="66.5" r="1.5" fill="#F0EAD6" stroke="#C8940A" stroke-width="0.4"/>
  <circle cx="73" cy="66.5" r="1.5" fill="#F0EAD6" stroke="#C8940A" stroke-width="0.4"/>
</svg>
