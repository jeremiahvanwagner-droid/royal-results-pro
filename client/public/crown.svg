<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" fill="none" aria-label="Royal Results 6-Point Crown">
  <defs>
    <!-- Gold gradients -->
    <linearGradient id="goldBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE980"/>
      <stop offset="35%" stop-color="#C8940A"/>
      <stop offset="100%" stop-color="#7A4E00"/>
    </linearGradient>
    <radialGradient id="goldPoint" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#8B6200"/>
    </radialGradient>
    <radialGradient id="velvet" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3355B8"/>
      <stop offset="100%" stop-color="#0A1640"/>
    </radialGradient>
    <radialGradient id="sapphireC" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6A9FFF"/>
      <stop offset="100%" stop-color="#0D2899"/>
    </radialGradient>
    <radialGradient id="sapphireS" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4A80FF"/>
      <stop offset="100%" stop-color="#091F88"/>
    </radialGradient>
    <!-- Luminous glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gemGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════
       GOLD BASE BAND
  ════════════════════════════════════════════ -->
  <rect x="10" y="83" width="140" height="20" rx="4" fill="url(#goldBand)" filter="url(#glowSm)"/>
  <!-- highlight line -->
  <rect x="10" y="83" width="140" height="3" rx="2" fill="#FFF0A0" opacity="0.6"/>
  <!-- rope braid -->
  <path d="M15 91 Q26 87 37 91 Q48 95 59 91 Q70 87 81 91 Q92 95 103 91 Q114 87 125 91 Q136 95 145 91"
        stroke="#D4A017" stroke-width="1.2" fill="none" opacity="0.45"/>

  <!-- ═══════════════════════════════════════════
       VELVET DOME BODY
       Crown arch connects the 6 spike bases:
       x=10(L-outer), x=42(L-inner), x=80(C), x=118(R-inner), x=150(R-outer)
       Valleys at x=26(far-L), x=61(mid-L), x=99(mid-R), x=134(far-R)
  ════════════════════════════════════════════ -->
  <path d="
    M10 85
    L10 62
    Q14 44 26 40
    L42 64
    L61 28
    L80 14
    L99 28
    L118 64
    L134 40
    Q146 44 150 62
    L150 85
    Z"
    fill="url(#velvet)"/>
  <!-- Gold outline with luminous glow -->
  <path d="
    M10 85
    L10 62
    Q14 44 26 40
    L42 64
    L61 28
    L80 14
    L99 28
    L118 64
    L134 40
    Q146 44 150 62
    L150 85"
    stroke="#D4A017" stroke-width="2.5" fill="none" filter="url(#glow)"/>

  <!-- Velvet rib lines -->
  <line x1="80" y1="14" x2="80" y2="85" stroke="#C8940A" stroke-width="1.2" opacity="0.35"/>
  <line x1="61" y1="28" x2="55" y2="85" stroke="#C8940A" stroke-width="0.9" opacity="0.28"/>
  <line x1="99" y1="28" x2="105" y2="85" stroke="#C8940A" stroke-width="0.9" opacity="0.28"/>
  <line x1="42" y1="64" x2="32" y2="85" stroke="#C8940A" stroke-width="0.7" opacity="0.2"/>
  <line x1="118" y1="64" x2="128" y2="85" stroke="#C8940A" stroke-width="0.7" opacity="0.2"/>

  <!-- ═══════════════════════════════════════════
       6 POINTS — evenly distributed
       P1=far-left  P2=mid-left  P3=center
       P4=mid-right P5=far-right P6=... wait,
       we have 5 arched points + the center peak = 5.
       True 6-point: use 6 distinct fleur tips:
       x ≈ 10, 38, 61, 99, 122, 150
  ════════════════════════════════════════════ -->

  <!-- POINT 1 — Far left (outer arch tip) -->
  <g filter="url(#glow)">
    <path d="M10 62 Q5 53 4 44 Q10 41 15 47 Q12 55 10 62Z" fill="url(#goldPoint)" stroke="#C8940A" stroke-width="0.9"/>
    <circle cx="7" cy="41" r="3" fill="#FFF0A0" stroke="#C8940A" stroke-width="0.7"/>
    <line x1="7" y1="38" x2="7" y2="31" stroke="#C8940A" stroke-width="1.8"/>
    <!-- fleur head -->
    <path d="M7 31 Q4 25 3.5 23 Q7 23.5 8 27 Q9 23.5 10.5 23 Q10 25 7 31Z" fill="#D4A017"/>
    <path d="M7 31 Q3.5 29.5 2.5 27 Q5 28 7 31Z" fill="#C8940A"/>
    <path d="M7 31 Q10.5 29.5 11.5 27 Q9 28 7 31Z" fill="#C8940A"/>
    <circle cx="7" cy="22" r="1.4" fill="#FFE566"/>
  </g>

  <!-- POINT 2 — Mid-left -->
  <g filter="url(#glow)">
    <path d="M42 64 Q38 54 38 45 Q42 42 46 47 Q44 56 42 64Z" fill="url(#goldPoint)" stroke="#C8940A" stroke-width="0.9"/>
    <circle cx="40" cy="42" r="2.8" fill="#FFF0A0" stroke="#C8940A" stroke-width="0.7"/>
    <line x1="40" y1="39.2" x2="40" y2="32" stroke="#C8940A" stroke-width="1.6"/>
    <path d="M40 32 Q37 26 36.5 24 Q40 24.5 41 28 Q42 24.5 43.5 24 Q43 26 40 32Z" fill="#D4A017"/>
    <path d="M40 32 Q36.5 30.5 35.5 28 Q38 29 40 32Z" fill="#C8940A"/>
    <path d="M40 32 Q43.5 30.5 44.5 28 Q42 29 40 32Z" fill="#C8940A"/>
    <circle cx="40" cy="23" r="1.3" fill="#FFE566"/>
  </g>

  <!-- POINT 3 — Center (tallest) -->
  <g filter="url(#glow)">
    <circle cx="80" cy="12" r="4" fill="#D4A017" stroke="#FFE566" stroke-width="1"/>
    <line x1="80" y1="8" x2="80" y2="-1" stroke="#C8940A" stroke-width="2.2"/>
    <path d="M80 -1 Q76 -8 75.5 -11 Q80 -10 81 -6 Q82 -10 84.5 -11 Q84 -8 80 -1Z"
          fill="#D4A017" transform="translate(0 10)"/>
    <path d="M80 -1 Q75 -2.5 73.5 -5 Q77 -4 80 -1Z" fill="#C8940A" transform="translate(0 10)"/>
    <path d="M80 -1 Q85 -2.5 86.5 -5 Q83 -4 80 -1Z" fill="#C8940A" transform="translate(0 10)"/>
    <circle cx="80" cy="-2" r="1.6" fill="#FFE566" transform="translate(0 10)"/>
    <!-- ambient halo -->
    <circle cx="80" cy="9" r="8" fill="#FFE566" opacity="0.07"/>
  </g>

  <!-- POINT 4 — Mid-right -->
  <g filter="url(#glow)">
    <path d="M118 64 Q122 54 122 45 Q118 42 114 47 Q116 56 118 64Z" fill="url(#goldPoint)" stroke="#C8940A" stroke-width="0.9"/>
    <circle cx="120" cy="42" r="2.8" fill="#FFF0A0" stroke="#C8940A" stroke-width="0.7"/>
    <line x1="120" y1="39.2" x2="120" y2="32" stroke="#C8940A" stroke-width="1.6"/>
    <path d="M120 32 Q117 26 116.5 24 Q120 24.5 121 28 Q122 24.5 123.5 24 Q123 26 120 32Z" fill="#D4A017"/>
    <path d="M120 32 Q116.5 30.5 115.5 28 Q118 29 120 32Z" fill="#C8940A"/>
    <path d="M120 32 Q123.5 30.5 124.5 28 Q122 29 120 32Z" fill="#C8940A"/>
    <circle cx="120" cy="23" r="1.3" fill="#FFE566"/>
  </g>

  <!-- POINT 5 — Far right (outer arch tip) -->
  <g filter="url(#glow)">
    <path d="M150 62 Q155 53 156 44 Q150 41 145 47 Q148 55 150 62Z" fill="url(#goldPoint)" stroke="#C8940A" stroke-width="0.9"/>
    <circle cx="153" cy="41" r="3" fill="#FFF0A0" stroke="#C8940A" stroke-width="0.7"/>
    <line x1="153" y1="38" x2="153" y2="31" stroke="#C8940A" stroke-width="1.8"/>
    <path d="M153 31 Q150 25 149.5 23 Q153 23.5 154 27 Q155 23.5 156.5 23 Q156 25 153 31Z" fill="#D4A017"/>
    <path d="M153 31 Q149.5 29.5 148.5 27 Q151 28 153 31Z" fill="#C8940A"/>
    <path d="M153 31 Q156.5 29.5 157.5 27 Q155 28 153 31Z" fill="#C8940A"/>
    <circle cx="153" cy="22" r="1.4" fill="#FFE566"/>
  </g>

  <!-- POINT 6 — Front-center base fleur (between P2 and P4 on the band rim) -->
  <g filter="url(#glowSm)">
    <!-- This is the 6th distinct point: a prominent fleur rising from the band center -->
    <path d="M80 83 Q77 75 78 68 Q80 71.5 80.5 75 Q82 71.5 83 68 Q84 75 81 83Z" fill="#D4A017" stroke="#C8940A" stroke-width="0.5"/>
    <circle cx="80" cy="66.5" r="2" fill="#FFE566" stroke="#C8940A" stroke-width="0.5"/>
    <!-- two flanking smaller fleurs on band rim -->
    <path d="M53 83 Q51 77 52 72 Q54 74.5 54.5 77.5 Q56 74.5 57 72 Q57.5 77 55.5 83Z" fill="#D4A017" opacity="0.9"/>
    <path d="M107 83 Q105 77 106 72 Q108 74.5 108.5 77.5 Q110 74.5 111 72 Q111.5 77 109.5 83Z" fill="#D4A017" opacity="0.9"/>
    <path d="M30 83 Q28.5 78.5 29 74.5 Q30.5 76.5 31 79 Q32.5 76.5 33 74.5 Q33.5 79 32 83Z" fill="#D4A017" opacity="0.75"/>
    <path d="M130 83 Q128.5 78.5 129 74.5 Q130.5 76.5 131 79 Q132.5 76.5 133 74.5 Q133.5 79 132 83Z" fill="#D4A017" opacity="0.75"/>
  </g>

  <!-- ═══════════════════════════════════════════
       SAPPHIRE GEMS ON BAND
  ════════════════════════════════════════════ -->
  <g filter="url(#gemGlow)">
    <!-- Center large sapphire -->
    <ellipse cx="80" cy="92" rx="7" ry="5.5" fill="url(#sapphireC)"/>
    <ellipse cx="80" cy="92" rx="7" ry="5.5" stroke="#8ABFFF" stroke-width="1" fill="none"/>
    <ellipse cx="77.5" cy="89.8" rx="2.2" ry="1.4" fill="#D8EEFF" opacity="0.6"/>
    <!-- Left sapphire -->
    <ellipse cx="45" cy="92" rx="4.8" ry="3.8" fill="url(#sapphireS)"/>
    <ellipse cx="45" cy="92" rx="4.8" ry="3.8" stroke="#6AABFF" stroke-width="0.8" fill="none"/>
    <ellipse cx="43.2" cy="90.2" rx="1.4" ry="1" fill="#D8EEFF" opacity="0.55"/>
    <!-- Right sapphire -->
    <ellipse cx="115" cy="92" rx="4.8" ry="3.8" fill="url(#sapphireS)"/>
    <ellipse cx="115" cy="92" rx="4.8" ry="3.8" stroke="#6AABFF" stroke-width="0.8" fill="none"/>
    <ellipse cx="113.2" cy="90.2" rx="1.4" ry="1" fill="#D8EEFF" opacity="0.55"/>
  </g>

  <!-- ═══════════════════════════════════════════
       PEARL ACCENTS
  ════════════════════════════════════════════ -->
  <circle cx="24" cy="83.5" r="2.5" fill="#F5EFE0" stroke="#C8940A" stroke-width="0.6" filter="url(#glowSm)"/>
  <circle cx="136" cy="83.5" r="2.5" fill="#F5EFE0" stroke="#C8940A" stroke-width="0.6" filter="url(#glowSm)"/>
  <circle cx="62" cy="82.5" r="2" fill="#F5EFE0" stroke="#C8940A" stroke-width="0.5"/>
  <circle cx="98" cy="82.5" r="2" fill="#F5EFE0" stroke="#C8940A" stroke-width="0.5"/>
</svg>
