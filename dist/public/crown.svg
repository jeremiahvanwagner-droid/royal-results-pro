<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE066;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE980;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9960C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gemBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6EC6FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gemRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A80;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C62828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7F0000;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Crown base band -->
  <rect x="10" y="55" width="80" height="18" rx="3" ry="3" fill="url(#goldGrad)" stroke="#8B6914" stroke-width="0.8"/>
  <!-- Band highlight -->
  <rect x="10" y="55" width="80" height="5" rx="3" ry="0" fill="#FFE980" opacity="0.5"/>

  <!-- Crown body (main shape) -->
  <!-- Left side wall -->
  <polygon points="10,57 18,57 22,30 10,40" fill="url(#goldGrad)" stroke="#8B6914" stroke-width="0.6"/>
  <!-- Right side wall -->
  <polygon points="90,57 82,57 78,30 90,40" fill="url(#goldGrad)" stroke="#8B6914" stroke-width="0.6"/>
  <!-- Center body -->
  <polygon points="22,57 78,57 78,30 22,30" fill="url(#goldGrad)" stroke="#8B6914" stroke-width="0.6"/>

  <!-- Left peak -->
  <polygon points="10,40 22,30 26,10 20,10" fill="url(#goldGrad2)" stroke="#8B6914" stroke-width="0.7"/>
  <!-- Center peak -->
  <polygon points="35,30 65,30 50,5" fill="url(#goldGrad2)" stroke="#8B6914" stroke-width="0.7"/>
  <!-- Right peak -->
  <polygon points="90,40 78,30 74,10 80,10" fill="url(#goldGrad2)" stroke="#8B6914" stroke-width="0.7"/>

  <!-- Velvet interior hint (dark area at top of center) -->
  <ellipse cx="50" cy="35" rx="22" ry="8" fill="#1a0a2e" opacity="0.35"/>

  <!-- Orbs atop peaks -->
  <!-- Left peak orb -->
  <circle cx="20" cy="10" r="4" fill="url(#goldGrad2)" stroke="#8B6914" stroke-width="0.7"/>
  <circle cx="19" cy="9" r="1.2" fill="#FFF8DC" opacity="0.7"/>
  <!-- Center peak orb -->
  <circle cx="50" cy="5" r="5" fill="url(#goldGrad2)" stroke="#8B6914" stroke-width="0.7"/>
  <circle cx="48.5" cy="4" r="1.8" fill="#FFF8DC" opacity="0.7"/>
  <!-- Right peak orb -->
  <circle cx="80" cy="10" r="4" fill="url(#goldGrad2)" stroke="#8B6914" stroke-width="0.7"/>
  <circle cx="79" cy="9" r="1.2" fill="#FFF8DC" opacity="0.7"/>

  <!-- Sapphire gems on band -->
  <!-- Center gem (blue) -->
  <ellipse cx="50" cy="64" rx="6" ry="5" fill="url(#gemBlue)" stroke="#0D47A1" stroke-width="0.6" filter="url(#glow)"/>
  <ellipse cx="48.5" cy="62.5" rx="2" ry="1.5" fill="#90CAF9" opacity="0.7"/>

  <!-- Left gem (red) -->
  <ellipse cx="27" cy="64" rx="4.5" ry="4" fill="url(#gemRed)" stroke="#7F0000" stroke-width="0.5" filter="url(#glow)"/>
  <ellipse cx="26" cy="63" rx="1.5" ry="1" fill="#FFCDD2" opacity="0.7"/>

  <!-- Right gem (red) -->
  <ellipse cx="73" cy="64" rx="4.5" ry="4" fill="url(#gemRed)" stroke="#7F0000" stroke-width="0.5" filter="url(#glow)"/>
  <ellipse cx="72" cy="63" rx="1.5" ry="1" fill="#FFCDD2" opacity="0.7"/>

  <!-- Small accent gems on band -->
  <circle cx="39" cy="64" r="2.5" fill="url(#gemBlue)" stroke="#0D47A1" stroke-width="0.4"/>
  <circle cx="61" cy="64" r="2.5" fill="url(#gemBlue)" stroke="#0D47A1" stroke-width="0.4"/>

  <!-- Cross-hatch engraving lines on body -->
  <line x1="22" y1="45" x2="78" y2="45" stroke="#8B6914" stroke-width="0.4" opacity="0.5"/>
  <line x1="22" y1="51" x2="78" y2="51" stroke="#8B6914" stroke-width="0.4" opacity="0.5"/>
</svg>
